<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - Tienda Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="mb-4 text-primary">➕ Agregar Nuevo Producto</h1>
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/tienda/guardar}" th:object="${producto}" method="POST">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del Producto:</label>
                                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                            </div>

                            <div class="mb-3">
                                <label for="precio" class="form-label">Precio:</label>
                                <input type="number" class="form-control" id="precio" th:field="*{precio}" step="0.01" required>
                            </div>

                            <div class="mb-3">
                                <label for="categoria" class="form-label">Categoría:</label>
                                <input type="text" class="form-control" id="categoria" th:field="*{categoria}" placeholder="ej: Electrónica, Accesorios..." required>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción:</label>
                                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="5" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="imagen" class="form-label">Nombre de la Imagen (archivo en recursos/imgs/):</label>
                                <input type="text" class="form-control" id="imagen" th:field="*{imagen}" placeholder="ej: producto.jpg" required>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">✅ Guardar Producto</button>
                                <a th:href="@{/tienda/catalogo}" class="btn btn-outline-secondary">← Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
