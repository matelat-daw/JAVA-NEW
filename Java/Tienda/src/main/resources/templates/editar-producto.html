<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Editar Producto - Tienda Tech')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="mb-4 text-primary">✏️ Editar Producto</h1>
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/tienda/actualizar}" method="POST" enctype="multipart/form-data">
                            <input type="hidden" name="id" th:value="${producto.id}">
                            
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del Producto:</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" th:value="${producto.nombre}" required>
                            </div>

                            <div class="mb-3">
                                <label for="precio" class="form-label">Precio:</label>
                                <input type="number" class="form-control" id="precio" name="precio" th:value="${producto.precio}" step="0.01" required>
                            </div>

                            <div class="mb-3">
                                <label for="categoria" class="form-label">Categoría:</label>
                                <input type="text" class="form-control" id="categoria" name="categoria" th:value="${producto.categoria}" required>
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción:</label>
                                <textarea class="form-control" id="descripcion" name="descripcion" rows="5" required th:text="${producto.descripcion}"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="imagen" class="form-label">Imagen del Producto:</label>
                                <div class="mb-2" th:if="${producto.imagen}">
                                    <img th:src="@{/recursos/imgs/} + ${producto.imagen}" class="img-thumbnail" style="max-height: 150px;" alt="Imagen actual">
                                    <small class="form-text text-muted d-block mt-2">Imagen actual: <strong th:text="${producto.imagen}"></strong></small>
                                </div>
                                <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
                                <small class="form-text text-muted">Soportados: JPG, PNG, GIF, WebP (máx. 5MB) - Dejar en blanco para mantener la imagen actual</small>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-warning btn-lg">✏️ Actualizar Producto</button>
                                <a th:href="@{/tienda/detalle/{id}(id=${producto.id})}" class="btn btn-outline-secondary">← Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
