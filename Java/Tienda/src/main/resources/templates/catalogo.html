<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Catálogo - Tienda Tech')}"></head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container py-5">
        <h1 class="mb-2 text-primary">📦 Catálogo de Productos</h1>
        
        <!-- Mensaje de éxito si se acaba de crear o eliminar un producto -->
        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <strong>✅ ¡Éxito!</strong> <span th:text="${mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        
        <!-- Mensaje de error -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
            <strong>❌ Error:</strong> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        
        <p class="text-muted mb-4">Total disponible: <span class="badge bg-info" th:text="${productos.size()}"></span> productos</p>

        <div class="mb-4">
            <a th:href="@{/tienda/nuevo}" class="btn btn-success">➕ Agregar Nuevo Producto</a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-striped align-middle">
                <thead class="table-success">
                    <tr>
                        <th>Imagen</th>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="producto : ${productos}">
                        <td>
                            <img th:src="@{/recursos/imgs/{imagen}(imagen=${producto.imagen})}"
                                 th:alt="${producto.nombre}"
                                 class="img-thumbnail"
                                 style="width: 80px; height: 80px; object-fit: cover;">
                        </td>
                        <td><span class="badge bg-secondary" th:text="${producto.id}"></span></td>
                        <td><strong th:text="${producto.nombre}"></strong></td>
                        <td><span class="badge bg-info" th:text="${producto.categoria}"></span></td>
                        <td><strong class="text-success" th:text="'$' + ${#numbers.formatDecimal(producto.precio, 1, 2)}"></strong></td>
                        <td>
                            <a th:href="@{/tienda/detalle/{id}(id=${producto.id})}" class="btn btn-sm btn-primary">👁️ Ver</a>
                            <a th:href="@{/tienda/editar/{id}(id=${producto.id})}" class="btn btn-sm btn-warning">✏️ Editar</a>
                            <a th:href="@{/tienda/eliminar/{id}(id=${producto.id})}" class="btn btn-sm btn-danger"
                               onclick="return confirm('¿Eliminar este producto?')">🗑️ Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav class="mt-4">
            <a th:href="@{/}" class="btn btn-outline-primary">← Volver al inicio</a>
        </nav>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
