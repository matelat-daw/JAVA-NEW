<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Producto - Tienda Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container py-5">
        <div class="row">
            <div class="col-md-6 mb-4">
                <img th:src="@{/recursos/imgs/{imagen}(imagen=${producto.imagen})}"
                     th:alt="${producto.nombre}"
                     class="img-fluid rounded"
                     style="width: 100%; height: auto;">
            </div>
            <div class="col-md-6">
                <h1 class="mb-3 text-primary" th:text="${producto.nombre}"></h1>
                <div class="mb-3">
                    <span class="badge bg-info" th:text="${producto.categoria}"></span>
                </div>
                <div class="mb-4">
                    <h3 class="text-success" th:text="'$' + ${#numbers.formatDecimal(producto.precio, 1, 2)}"></h3>
                </div>
                <div class="mb-4">
                    <h5>Descripción</h5>
                    <p th:text="${producto.descripcion}"></p>
                </div>
                <div class="mb-4">
                    <p><strong>ID Producto:</strong> <span th:text="${producto.id}"></span></p>
                </div>
                <div class="d-grid gap-2">
                    <a th:href="@{/tienda/editar/{id}(id=${producto.id})}" class="btn btn-warning btn-lg">✏️ Editar Producto</a>
                    <a th:href="@{/tienda/catalogo}" class="btn btn-outline-primary">← Volver al Catálogo</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
