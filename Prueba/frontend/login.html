<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba App - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">Login</h3>
            </div>
            <div class="card-body">
                <form id="login-form">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <div class="mt-3 text-center">
                    <p class="mb-0">Don't have an account? <a href="register.html">Register here</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Inicializar solo el login
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('login-form');
            if (form) {
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;

                    try {
                        const response = await apiRequest('/auth/signin', {
                            method: 'POST',
                            body: JSON.stringify({ username, password })
                        });

                        // Guardar datos del usuario
                        AppState.token = response.jwt;
                        AppState.currentUser = {
                            id: response.id,
                            username: response.username,
                            email: response.email
                        };
                        AppState.roles = response.roles;

                        // Guardar en localStorage
                        localStorage.setItem('currentUser', JSON.stringify(AppState.currentUser));
                        localStorage.setItem('authToken', AppState.token);
                        localStorage.setItem('userRoles', JSON.stringify(AppState.roles));

                        showSuccess('Login successful!');
                        
                        // Redirigir a profile
                        setTimeout(() => {
                            window.location.href = 'profile.html';
                        }, 1000);
                    } catch (error) {
                        showError('Invalid username or password');
                    }
                });
            }
        });
    </script>
</body>
</html>
